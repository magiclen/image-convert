name: CI-version

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        toolchain:
          - stable
          - nightly
        features:
          -
    name: Test ${{ matrix.toolchain }} on ${{ matrix.os }} (${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install ImageMagick (Linux)
        run: |
          sudo apt update
          sudo apt install librsvg2-dev libwebp-dev
          wget https://download.imagemagick.org/archive/ImageMagick.tar.gz
          tar xf ImageMagick.tar.gz
          cd ImageMagick-*
          ./configure --enable-hdri --with-rsvg
          make -j$(nproc)
          sudo make install
          sudo ldconfig
        if: runner.os == 'Linux'
      # `imagemagick-full` is used because the `imagemagick` formula has no rsvg delegate.
      # Homebrew links the delegates itself, which building from source on macOS fails to do.
      - name: Install ImageMagick (macOS)
        run: |
          brew update
          brew list pkgconf || brew install pkgconf
          brew uninstall --ignore-dependencies imagemagick || true
          brew install imagemagick-full
          magick -version
          pkg-config --modversion MagickWand
        if: runner.os == 'macOS'
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --release ${{ matrix.features }}
      - run: cargo test --release --features tokio ${{ matrix.features }}
      - run: cargo doc --release ${{ matrix.features }}

  MSRV:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        toolchain:
          - "1.85"
        features:
          -
    name: Test ${{ matrix.toolchain }} on ${{ matrix.os }} (${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install ImageMagick (Linux)
        run: |
          sudo apt update
          sudo apt install librsvg2-dev libwebp-dev
          wget https://download.imagemagick.org/archive/ImageMagick.tar.gz
          tar xf ImageMagick.tar.gz
          cd ImageMagick-*
          ./configure --enable-hdri --with-rsvg
          make -j$(nproc)
          sudo make install
          sudo ldconfig
        if: runner.os == 'Linux'
      # `imagemagick-full` is used because the `imagemagick` formula has no rsvg delegate.
      # Homebrew links the delegates itself, which building from source on macOS fails to do.
      - name: Install ImageMagick (macOS)
        run: |
          brew update
          brew list pkgconf || brew install pkgconf
          brew uninstall --ignore-dependencies imagemagick || true
          brew install imagemagick-full
          magick -version
          pkg-config --modversion MagickWand
        if: runner.os == 'macOS'
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --release --lib --bins ${{ matrix.features }}