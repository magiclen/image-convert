name: CI

on: [ push, pull_request ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
      - uses: actions-rust-lang/rustfmt@v1

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Install ImageMagick
        run: |
          sudo apt update
          sudo apt install libwebp-dev
          wget https://download.imagemagick.org/archive/ImageMagick.tar.gz
          tar xf ImageMagick.tar.gz
          cd ImageMagick-*
          ./configure --enable-hdri
          make -j"$(nproc)"
          sudo make install
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        toolchain:
          - stable
          - nightly
        features:
          -
    name: Test ${{ matrix.toolchain }} on ${{ matrix.os }} (${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install ImageMagick (Linux)
        run: |
          sudo apt update
          sudo apt install librsvg2-dev libwebp-dev libheif-dev libheif-plugin-libde265 liblcms2-dev ffmpeg
          wget https://download.imagemagick.org/archive/ImageMagick.tar.gz
          tar xf ImageMagick.tar.gz
          cd ImageMagick-*
          ./configure --enable-hdri --with-rsvg
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
        if: runner.os == 'Linux'
      # imagemagick-full provides the rsvg, heic, and lcms delegates.
      # It is keg-only, so its bin and pkg-config paths are exported for the later steps.
      - name: Install ImageMagick (macOS)
        run: |
          brew update
          brew list pkgconf || brew install pkgconf
          brew uninstall --ignore-dependencies imagemagick || true
          brew install imagemagick-full ffmpeg
          image_magick_prefix="$(brew --prefix imagemagick-full)"
          export PATH="$image_magick_prefix/bin:$PATH"
          export PKG_CONFIG_PATH="$image_magick_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          echo "$image_magick_prefix/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          magick -version
          pkg-config --modversion MagickWand
        if: runner.os == 'macOS'
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test ${{ matrix.features }}
      - run: cargo test --features tokio ${{ matrix.features }}
      - run: cargo doc ${{ matrix.features }}

  MSRV:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        toolchain:
          - "1.85"
        features:
          -
    name: Test ${{ matrix.toolchain }} on ${{ matrix.os }} (${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install ImageMagick (Linux)
        run: |
          sudo apt update
          sudo apt install librsvg2-dev libwebp-dev
          wget https://download.imagemagick.org/archive/ImageMagick.tar.gz
          tar xf ImageMagick.tar.gz
          cd ImageMagick-*
          ./configure --enable-hdri --with-rsvg
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
        if: runner.os == 'Linux'
      # imagemagick-full provides the rsvg, heic, and lcms delegates.
      # It is keg-only, so its bin and pkg-config paths are exported for the later steps.
      - name: Install ImageMagick (macOS)
        run: |
          brew update
          brew list pkgconf || brew install pkgconf
          brew uninstall --ignore-dependencies imagemagick || true
          brew install imagemagick-full
          image_magick_prefix="$(brew --prefix imagemagick-full)"
          export PATH="$image_magick_prefix/bin:$PATH"
          export PKG_CONFIG_PATH="$image_magick_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          echo "$image_magick_prefix/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          magick -version
          pkg-config --modversion MagickWand
        if: runner.os == 'macOS'
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --lib --bins ${{ matrix.features }}